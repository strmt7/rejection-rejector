# cargo-mutants configuration for Rejection Rejector.
# Focus mutation evidence on compact code that controls unattended actions,
# parsing, readiness, managed policy, recovery, emergency containment, API
# credential verification, retry/circuit semantics and crash-session safety.
# Huge orchestration/store modules remain covered by deterministic/concurrency/
# recovery tests and other deep gates rather than making this campaign time out.

examine_globs = [
  "src/config.rs",
  "src/mail.rs",
  "src/readiness.rs",
  "src/policy.rs",
  "src/recovery.rs",
  "src/recovery/**",
  "src/emergency.rs",
  "src/api_auth.rs",
  "src/retry.rs",
  "src/session.rs",
]

all_features = true
timeout_multiplier = 3.0
minimum_test_timeout = 20.0
error_values = ["::anyhow::anyhow!(\"mutated failure\")"]
output = "artifacts/mutants"
