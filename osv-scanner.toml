# OSV-Scanner / OpenSSF Scorecard vulnerability triage.
#
# The three ignores below are the Linux-only accessibility stack of
# egui-winit: accesskit_winit -> accesskit_unix -> atspi -> zvariant 5 /
# zbus_names 4. These crates are unreachable in the shipped Windows binary
# (the Windows build compiles accesskit_windows, not accesskit_unix), and
# the advisories are "unmaintained" notices with no patched version inside
# our semver-compatible range - the migration to zvariant 6 belongs to the
# upstream accesskit/atspi crates. Disabling the Linux accessibility
# feature to silence them would be a functional regression for Linux users.
#
# Re-check: when accesskit_unix/atspi publish a release on zvariant 6,
# remove these ignores and `cargo update` the stack.

[[Ignored]]
id = "RUSTSEC-2026-0370"
reason = "zvariant 5 unmaintained; Linux-only a11y stack (accesskit_unix -> atspi), unreachable in the Windows binary; upstream migration required (no patched version in range)"

[[Ignored]]
id = "RUSTSEC-2026-0371"
reason = "zbus_names 4 unmaintained; Linux-only a11y stack (accesskit_unix -> atspi), unreachable in the Windows binary; upstream migration required (no patched version in range)"

[[Ignored]]
id = "RUSTSEC-2026-0372"
reason = "zvariant_derive 5 unmaintained; Linux-only a11y stack (accesskit_unix -> atspi), unreachable in the Windows binary; upstream migration required (no patched version in range)"
