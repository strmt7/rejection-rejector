[package]
name = "rejection-rejector"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
publish = false
autobins = false
default-run = "rejection-rejector"
description = "Native local-first AI job rejection review and controlled replies"
license = "MIT"
repository = "https://github.com/strmt7/rejection-rejector"

[lib]
name = "rejection_rejector"
path = "src/lib.rs"

[[bin]]
name = "rejection-rejector"
path = "src/bin/desktop.rs"
required-features = ["gui"]

[[bin]]
name = "rr"
path = "src/bin/rr.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:image"]

[dependencies]
anyhow = "1"
argon2 = "0.6"
base64 = "0.23"
chacha20poly1305 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
ctrlc = "3"
# Pinned terminal-UI stack for `rr tui` (both MIT / Apache-2.0 dual licensed).
# ratatui 0.30 drives crossterm 0.29 through its `crossterm_0_29` feature so
# the direct crossterm dependency and the widget backend share one crate.
crossterm = "=0.29.0"
directories = "6"
fs2 = "0.4"
html2text = "0.17"
lingua = { version = "1.8", default-features = false, features = ["english", "chinese", "hindi", "spanish", "french", "arabic", "bengali", "portuguese", "russian", "urdu", "german", "greek"] }
mailparse = "0.18"
rand = "0.10"
ratatui = { version = "=0.30.2", default-features = false, features = ["std", "layout-cache", "crossterm_0_29"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "webpki-roots", "form", "query"] }
ring = "0.17.14"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
subtle = "2"
tempfile = "3"
tiny_http = "0.12"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webbrowser = "1"
which = "8"
zeroize = "1"
yoke-derive = "0.8.4"
eframe = { version = "0.36.2", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
rfd = { version = "0.17.2", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[package.metadata.cargo-machete]
# Intentional resolver-only dependency: yoke-derive 0.8.3 is yanked while
# yoke 0.8.3 accepts ^0.8.2. Keep 0.8.2 pinned until the upstream graph moves.
ignored = ["yoke-derive"]

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
overflow-checks = true

# This Cargo.toml follows the 2024 edition and requires Rust 1.99.0 or newer
