[package]
name = "rejection-rejector"
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
publish = false
autobins = false
default-run = "rr"
description = "Native local-first AI job rejection review and controlled replies"
license = "MIT"
repository = "https://github.com/strmt7/rejection-rejector"

[lib]
name = "rejection_rejector"
path = "src/lib.rs"

[[bin]]
name = "rr"
path = "src/bin/rr.rs"

[[bin]]
name = "rr-tray"
path = "src/bin/rr-tray.rs"

[features]
default = []

[dependencies]
anyhow = "1"
argon2 = "0.6"
base64 = "0.23"
chacha20poly1305 = "0.11"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
ctrlc = "3"
# Pinned terminal-UI stack for `rr tui` (both MIT / Apache-2.0 dual licensed).
# ratatui 0.30 drives crossterm 0.29 through its `crossterm_0_29` feature so
# the direct crossterm dependency and the widget backend share one crate.
crossterm = "=0.29.0"
directories = "6"
fs2 = "0.4"
html2text = "0.17"
html5ever = "0.40.1"
lingua = { version = "1.8", default-features = false, features = ["english", "chinese", "hindi", "spanish", "french", "arabic", "bengali", "portuguese", "russian", "urdu", "german", "greek", "japanese", "italian", "dutch"] }
mailparse = "0.18"
rand = "0.10"
# App-password (IMAP/SMTP basic-auth) transport. Gmail app passwords work only
# over IMAP/SMTP (the Gmail REST API is OAuth-only), so accepting them needs a
# second transport alongside the Gmail-API path. `lettre` sends over SMTP
# (rustls, matching the app's TLS stack) and `imap` reads over IMAP. The app
# password is a static secret held only in the encrypted vault (vault.rs) —
# never in the repository, config, or logs.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "rustls-tls"] }
io-imap = { version = "0.7.1", default-features = false, features = ["client", "native-tls"] }
# imap-codec (via io-imap) needs nom's `alloc`; this also drops imap 2's nom 5 ->
# unsound lexical-core 0.7.6 (RUSTSEC-2023-0086) for nom 7 + minimal-lexical.
nom = { version = "7", features = ["alloc", "std"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["std", "layout-cache", "crossterm_0_29"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "webpki-roots", "form", "query"] }
ring = "0.17.14"
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
subtle = "2"
tempfile = "3"
tiny_http = "0.12"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webbrowser = "1"
which = "8"
zeroize = "1"
yoke-derive = "0.8.4"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# System-tray shell (`rr-tray`): `tray-icon` wraps Shell_NotifyIconW behind a
# safe builder/event-channel API (the bare `windows`/`windows-sys` binding is
# an FFI call this workspace's forbid(unsafe_code) lint cannot call directly),
# and `winit` supplies the documented message-loop pairing for it. Both are
# MIT/Apache-2.0 and carry the safe abstraction internally, so `rr-tray`
# stays free of raw FFI. Linux-only tray backends are not enabled here.
tray-icon = { version = "0.26", default-features = false }
winit = { version = "0.30", default-features = false }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[package.metadata.cargo-machete]
# Intentional resolver-only dependency: yoke-derive 0.8.3 is yanked while
# yoke-derive must track the yoke core's derive-macro minor line; the declared
# requirement is the caret range 0.8.4 (no exact pin exists or is needed).
ignored = ["yoke-derive", "nom"]

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
overflow-checks = true

# This Cargo.toml follows the 2024 edition and requires Rust 1.99.0 or newer
