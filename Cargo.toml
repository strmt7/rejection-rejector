[package]
name = "rejection-rejector"
version = "0.1.0"
edition = "2021"
autobins = false
description = "Local-first job rejection review and controlled replies"
license = "MIT"
repository = "https://github.com/strmt7/rejection-rejector"

[lib]
name = "rejection_rejector"
path = "src/lib.rs"

[features]
default = []

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
fs2 = "0.4"
html2text = "0.14"
mailparse = "0.15"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
