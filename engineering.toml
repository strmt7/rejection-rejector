# Engineering policy record for strmt7/rejection-rejector (S01).
#
# Machine-readable policy record required by shared requirement S01 of the
# 2026-10-27 engineering implementation manual and validated against the
# exact reference schema vendored at tools/contract/engineering-policy.schema.json.
# Verified read-only by `python tools/check_engineering_policy.py` and, for
# execution receipts, by `python tools/contract/validate_contract.py`.
# Native manifests (Cargo.toml/Cargo.lock, rust-toolchain.toml) stay
# authoritative for dependency graphs; this record references them.

schema_version = "1.0"
repo = "strmt7/rejection-rejector"
# Historical traceability baseline: the manual's audited snapshot for this
# repository. Future implementation commits may differ from it.
audit_baseline_sha = "589b89fceac51effa6922e210d4ee8a4033c9a32"
owner = "strmt7 (sole maintainer)"
lifecycle = "maintained"
reviewed_on = "2026-10-28"
review_due = "2027-04-28"
input_files_reason = "Cargo.lock is the dependency-resolution authority and rust-toolchain.toml pins the compiler; both are hashed so a receipt binds the exact dependency and toolchain inputs."

[profile]
# The shared engineering baseline (S02) is a proposed coordination repository
# that does not exist yet. Until it is published, the profile identity names
# this repository's own frozen engineering inputs at the audited commit
# (rust-toolchain.toml, deny.toml, .editorconfig, AGENTS.md conventions).
# Homogeneity qualification stays BLOCKED under exception EX-001.
id = "rr-repo-engineering-baseline-589b89f"
sha = "589b89fceac51effa6922e210d4ee8a4033c9a32"
source_url = "https://github.com/strmt7/rejection-rejector/tree/589b89fceac51effa6922e210d4ee8a4033c9a32"

[roots]
authored = ["src", "tests", "scripts", "tools", "training", "docs", "config", "windows", "fuzz", "build.rs"]
generated = ["target", "__pycache__"]
vendor = []
fixture = ["tests/fixtures", "training/data"]

