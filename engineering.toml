environment = "rust-windows-msvc"
applicable = true
reason = "Read-only formatting check at the same version and scope as format; also a tools/local_ci.py gate"

[[commands]]
id = "lint"
command = "cargo clippy --locked --all-targets --all-features -- -D warnings"
environment = "rust-windows-msvc"
