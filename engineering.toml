reason = "Fetches the exact locked dependency graph; external prerequisites (MSVC Build Tools, Windows SDK, VC++ v14 Redistributable, CPython 3.12, Ollama for runtime) are documented in docs/SETUP.md and docs/WINDOWS-RUNTIME.md"

[[commands]]
