[[exceptions]]
id = "EX-001"
requirement_id = "S02"
owner = "strmt7 (sole maintainer)"
reason = "The shared engineering baseline repository (S02) is a proposed coordination repository and is not published yet, so no reviewed shared-profile commit exists to pin; compensating control: this repository's own frozen tool/profile inputs at the audit baseline (rust-toolchain.toml 1.99.1, deny.toml, .editorconfig, AGENTS.md conventions) with local/CI agreement enforced by tools/local_ci.py. Homogeneity qualification remains BLOCKED until the baseline is published."
expires_on = "2027-04-28"
alternative_command_ids = ["verify"]
alternative_test_family_ids = ["operator-tools"]

[[exceptions]]
id = "EX-002"
requirement_id = "S02"
owner = "strmt7 (sole maintainer)"
reason = "SHOULD-exception to the manual's 100-character Python line-length default: the maintainer-standardized pilot configuration uses 120 (FlitzZip .ruff.toml at 4e6a1bb0d144611a09dcbc65276faa676e923882 sets line-length = 120 with Ruff E-family selected; DeepSource Python max_line_length is set to 120 in the dashboard). The 120 choice meets the same contract through Ruff E501 at 120 plus DeepSource at 120 and avoids reformatting the frozen pilot scope; it is a versioned profile override until the shared baseline resolves the default."
expires_on = "2027-04-28"
alternative_command_ids = ["lint"]
alternative_test_family_ids = ["operator-tools"]

[[exceptions]]
id = "EX-003"
requirement_id = "S04"
owner = "strmt7 (sole maintainer)"
reason = "No stable aggregate verify job exists yet and the branch-protection API reported required_status_checks = null on 2026-10-28, so a deliberate failing change is not server-side blocked by required checks; compensating controls: one required approving review with stale-review dismissal (verified via API), force-push/deletion blocks, tools/local_ci.py exact-gate runner and named per-workflow checks. Aggregate job + required-check enforcement are directed work owned by the workflow/settings maintainers."
expires_on = "2027-01-31"
alternative_command_ids = ["verify"]
alternative_test_family_ids = ["operator-tools"]
