name: Parser fuzzing

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parser-fuzzing
  cancel-in-progress: true

jobs:
  fuzz:
    name: Bounded libFuzzer regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned nightly toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: nightly-2026-09-26
      - name: Install current pinned cargo-fuzz
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-fuzz@0.13.2
          checksum: true
          fallback: none
      - name: Fuzz mailbox and quote boundaries
        run: cargo fuzz run mail_boundaries -- -max_total_time=90 -max_len=65536 -rss_limit_mb=2048
      - name: Fuzz MIME parser
        run: cargo fuzz run mime_parser -- -max_total_time=90 -max_len=262144 -rss_limit_mb=2048
      - name: Upload crash evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rejection-rejector-fuzz-crash-${{ github.sha }}
          path: |
            fuzz/artifacts/
            fuzz/corpus/
          if-no-files-found: ignore
          retention-days: 30
