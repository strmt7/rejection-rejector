name: Attested Windows package

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type PACKAGE to build an attested Windows package from the exact main commit
        required: true
        type: string
      signing:
        description: Publisher-signing mode. Azure mode fails closed unless OIDC and Artifact Signing are fully configured.
        required: true
        type: choice
        default: unsigned
        options:
          - unsigned
          - azure-artifact-signing

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: attested-windows-package
  cancel-in-progress: false

jobs:
  package:
    if: inputs.confirmation == 'PACKAGE'
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_WARNINGS: deny
      RR_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - name: Assert workflow packages the triggering main commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
      - name: Require green security and verification workflows for this exact commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'Rust CI',
            'Rust public API compatibility',
            'Supply-chain security',
            'CodeQL Rust security',
            'OpenSSF Scorecard',
            'Workflow static analysis'
          )
          $deadline = (Get-Date).AddMinutes(15)
          while ($true) {
            $payload = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$env:GITHUB_SHA&per_page=100" | ConvertFrom-Json
            $missing = @()
            $pending = @()
            foreach ($name in $required) {
              $runs = @($payload.workflow_runs | Where-Object {
                $_.name -eq $name -and $_.head_sha -eq $env:GITHUB_SHA
              } | Sort-Object run_number -Descending)
              if ($runs.Count -eq 0) {
                $missing += $name
                continue
              }
              $run = $runs[0]
              if ($run.status -ne 'completed') {
                $pending += "$name ($($run.status))"
                continue
              }
              if ($run.conclusion -ne 'success') {
                throw "Release gate failed: $name concluded '$($run.conclusion)' for $env:GITHUB_SHA"
              }
            }
            if ($missing.Count -eq 0 -and $pending.Count -eq 0) {
              Write-Host "All required workflows are green for $env:GITHUB_SHA"
              break
            }
            if ((Get-Date) -ge $deadline) {
              throw "Release gate timed out. Missing: $($missing -join ', '); pending: $($pending -join ', ')"
            }
            Write-Host "Waiting for exact-commit gates. Missing: $($missing -join ', '); pending: $($pending -join ', ')"
            Start-Sleep -Seconds 15
          }
      - name: Require recent deep-quality evidence from main
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $requirements = @(
            @{ Name = 'Rust fuzzing'; MaxAgeDays = 8 },
            @{ Name = 'Rust coverage'; MaxAgeDays = 8 },
            @{ Name = 'Mutation testing'; MaxAgeDays = 8 },
            @{ Name = 'Enterprise deep verification'; MaxAgeDays = 8 },
            @{ Name = 'Windows reproducibility'; MaxAgeDays = 8 }
          )
          $payload = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100" | ConvertFrom-Json
          $now = [DateTimeOffset]::UtcNow
          foreach ($requirement in $requirements) {
            $runs = @($payload.workflow_runs | Where-Object {
              $_.name -eq $requirement.Name -and
              $_.head_branch -eq 'main'
            } | Sort-Object run_number -Descending)
            if ($runs.Count -eq 0) {
              throw "Release gate failed: no '$($requirement.Name)' evidence exists on main"
            }
            $run = $runs[0]
            if ($run.status -ne 'completed') {
              throw "Release gate failed: latest '$($requirement.Name)' run #$($run.run_number) is '$($run.status)'; wait for it to complete and retrigger packaging"
            }
            if ($run.conclusion -ne 'success') {
              throw "Release gate failed: latest '$($requirement.Name)' run #$($run.run_number) concluded '$($run.conclusion)'"
            }
            $completed = [DateTimeOffset]::Parse($run.updated_at)
            $age = $now - $completed
            if ($age.TotalDays -gt $requirement.MaxAgeDays) {
              throw "Release gate failed: latest '$($requirement.Name)' evidence is $([Math]::Round($age.TotalDays, 2)) days old; maximum is $($requirement.MaxAgeDays)"
            }
            $encodedBase = [Uri]::EscapeDataString($run.head_sha)
            $encodedHead = [Uri]::EscapeDataString($env:GITHUB_SHA)
            $comparison = gh api "repos/$env:GITHUB_REPOSITORY/compare/$encodedBase...$encodedHead" | ConvertFrom-Json
            if ($comparison.status -notin @('ahead', 'identical')) {
              throw "Release gate failed: '$($requirement.Name)' evidence commit $($run.head_sha) is not an ancestor of release commit $env:GITHUB_SHA (compare status '$($comparison.status)')"
            }
            Write-Host "$($requirement.Name): latest run #$($run.run_number), $([Math]::Round($age.TotalHours, 1)) hours old, commit $($run.head_sha) is in release history"
          }

      - name: Confirm main has not moved during release gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $line = git ls-remote origin refs/heads/main
          $remote = (($line -split '\s+')[0]).Trim()
          if ($remote -ne $env:GITHUB_SHA) {
            throw "main moved from $env:GITHUB_SHA to $remote while release validation was running; retrigger from the new head"
          }
      - name: Pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install pinned release-audit tooling
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-cyclonedx@0.5.9,cargo-auditable@0.7.6,cargo-audit@0.22.2
          checksum: true
          fallback: none
      - name: Verify release source
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --locked --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build auditable native release binaries
        run: cargo auditable build --locked --release --bins
      - name: Verify embedded build identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          target/release/rr.exe build-info | Set-Content artifacts/build-info.json -Encoding utf8
          $info = Get-Content artifacts/build-info.json -Raw | ConvertFrom-Json
          if (-not $info.source_commit_verified) { throw "Release binary does not report a verified source commit" }
          if ($info.source_commit -ne $env:GITHUB_SHA) { throw "Embedded source commit does not match release commit" }
          if ($info.profile -ne 'release') { throw "Embedded build profile is not release" }
          $lockHash = (Get-FileHash Cargo.lock -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($info.cargo_lock_sha256 -ne $lockHash) { throw "Embedded Cargo.lock hash does not match packaged lockfile" }
          if ($info.identity_sha256.Length -ne 64 -or $info.identity_sha256 -notmatch '^[0-9a-f]+$') {
            throw "Invalid embedded build identity"
          }
      - name: Verify embedded compatibility-contract identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          target/release/rr.exe contract-info | Set-Content artifacts/contract-info.json -Encoding utf8
          $contracts = Get-Content artifacts/contract-info.json -Raw | ConvertFrom-Json
          if ($contracts.schema_version -ne 1) { throw "Unsupported contract-info schema" }
          $openapiHash = (Get-FileHash docs/openapi-v1.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($contracts.api_contract_sha256 -ne $openapiHash) {
            throw "Embedded API contract hash does not match docs/openapi-v1.json"
          }
          $policyHash = (Get-FileHash docs/enterprise-policy.schema.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($contracts.enterprise_policy_schema_sha256 -ne $policyHash) {
            throw "Embedded enterprise policy schema hash does not match docs/enterprise-policy.schema.json"
          }
          if ($contracts.settings_format_version -lt 1 -or $contracts.database_schema_version -lt 1) {
            throw "Invalid embedded persistence compatibility versions"
          }
          if ($contracts.evaluation_suite_sha256.Length -ne 64 -or $contracts.evaluation_suite_sha256 -match '[^0-9a-f]') {
            throw "Invalid embedded evaluation-suite fingerprint"
          }

      - name: Audit the shipped executables themselves
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          cargo audit bin target/release/rejection-rejector.exe | Tee-Object -FilePath artifacts/rejection-rejector-binary-audit.txt
          cargo audit bin target/release/rr.exe | Tee-Object -FilePath artifacts/rr-binary-audit.txt
          if ($LASTEXITCODE -ne 0) { throw "Binary RustSec audit failed" }
          cargo auditable --version | Set-Content artifacts/cargo-auditable-version.txt -Encoding ascii
          cargo audit --version | Set-Content artifacts/cargo-audit-version.txt -Encoding ascii
      - name: Generate CycloneDX SBOM
        shell: bash
        run: |
          set -euo pipefail
          cargo cyclonedx --format json --spec-version 1.5 --all-features --target all --override-filename rejection-rejector.cdx
          mkdir -p artifacts
          find . -maxdepth 2 -name 'rejection-rejector.cdx.json' -exec cp {} artifacts/rejection-rejector.cdx.json \;
          test -s artifacts/rejection-rejector.cdx.json

      - name: Validate Azure Artifact Signing configuration
        if: inputs.signing == 'azure-artifact-signing'
        shell: pwsh
        env:
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @(
            'ARTIFACT_SIGNING_ENDPOINT',
            'ARTIFACT_SIGNING_ACCOUNT',
            'ARTIFACT_SIGNING_PROFILE',
            'AZURE_CLIENT_ID',
            'AZURE_TENANT_ID',
            'AZURE_SUBSCRIPTION_ID'
          )) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "Env:$name").Value)) {
              throw "Signed packaging requested but $name is not configured"
            }
          }

      - name: Azure login with GitHub OIDC
        if: inputs.signing == 'azure-artifact-signing'
        uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Authenticode-sign release executables with Azure Artifact Signing
        if: inputs.signing == 'azure-artifact-signing'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\target\release\rejection-rejector.exe
            ${{ github.workspace }}\target\release\rr.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
          trace: false

      - name: Verify publisher signature state and record evidence
        shell: pwsh
        env:
          SIGNING_MODE: ${{ inputs.signing }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts | Out-Null
          $records = @()
          foreach ($path in @(
            'target/release/rejection-rejector.exe',
            'target/release/rr.exe'
          )) {
            $signature = Get-AuthenticodeSignature -FilePath $path
            if ($env:SIGNING_MODE -eq 'azure-artifact-signing' -and $signature.Status -ne 'Valid') {
              throw "Authenticode verification failed for $path: $($signature.Status) $($signature.StatusMessage)"
            }
            if ($env:SIGNING_MODE -eq 'unsigned' -and $signature.Status -eq 'Valid') {
              throw "Unsigned packaging mode unexpectedly produced a publisher-signed executable: $path"
            }
            $records += [ordered]@{
              file = [IO.Path]::GetFileName($path)
              requested_mode = $env:SIGNING_MODE
              status = [string]$signature.Status
              signer_subject = if ($signature.SignerCertificate) { $signature.SignerCertificate.Subject } else { $null }
              signer_thumbprint = if ($signature.SignerCertificate) { $signature.SignerCertificate.Thumbprint } else { $null }
              timestamper_subject = if ($signature.TimeStamperCertificate) { $signature.TimeStamperCertificate.Subject } else { $null }
            }
          }
          [ordered]@{
            schema_version = 1
            requested_mode = $env:SIGNING_MODE
            verified_signed = ($env:SIGNING_MODE -eq 'azure-artifact-signing')
            files = $records
          } | ConvertTo-Json -Depth 6 | Set-Content artifacts/signing.json -Encoding utf8

      - name: Assemble release evidence package
        id: package
        shell: pwsh
        env:
          SIGNING_MODE: ${{ inputs.signing }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/windows | Out-Null
          Copy-Item target/release/rejection-rejector.exe,target/release/rr.exe artifacts/windows/
          Copy-Item README.md,LICENSE,SECURITY.md,CHANGELOG.md artifacts/windows/
          Copy-Item -Recurse docs artifacts/windows/docs
          Copy-Item Cargo.lock artifacts/windows/
          Copy-Item artifacts/build-info.json,artifacts/contract-info.json,artifacts/signing.json,artifacts/rejection-rejector.cdx.json artifacts/windows/
          git rev-parse HEAD | Set-Content artifacts/windows/COMMIT.txt -Encoding ascii
          rustc --version | Set-Content artifacts/windows/toolchain.txt -Encoding ascii
          cargo --version | Add-Content artifacts/windows/toolchain.txt -Encoding ascii
          $root = (Resolve-Path artifacts/windows).Path
          Get-ChildItem $root -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\','/')
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          } | Set-Content artifacts/windows/SHA256SUMS.txt -Encoding ascii
          $flavor = if ($env:SIGNING_MODE -eq 'azure-artifact-signing') { 'signed' } else { 'unsigned' }
          $packageName = "rejection-rejector-windows-x64-$flavor.zip"
          $packagePath = Join-Path 'artifacts' $packageName
          Compress-Archive -Path artifacts/windows/* -DestinationPath $packagePath
          $packageHash = (Get-FileHash $packagePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$packageHash  $packageName" | Set-Content artifacts/SHA256.txt -Encoding ascii
          "package_path=$packagePath" | Add-Content $env:GITHUB_OUTPUT
          "package_name=$packageName" | Add-Content $env:GITHUB_OUTPUT
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.package_path }}
      - name: Attest package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.package_path }}
          sbom-path: artifacts/rejection-rejector.cdx.json
      - name: Upload package and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rejection-rejector-attested-windows-${{ inputs.signing }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
