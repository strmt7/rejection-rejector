name: Rust coverage

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "fuzz/**"
      - "scripts/**"
      - "config/**"
      - ".cargo/**"
      - ".github/**"
      - "windows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".rustfmt.toml"
      - "deny.toml"
      - ".gitattributes"
      - ".gitignore"
      - ".editorconfig"
      - "docs/openapi-v1.json"
      - "docs/openapi-v1-baseline.json"
      - "docs/enterprise-policy.schema.json"
  schedule:
    - cron: "43 2 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-coverage-main
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage evidence
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.99.0 with llvm-tools
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov 0.9.1
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-llvm-cov@0.9.1
          checksum: true
          fallback: none
      - name: Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev
      - name: Generate coverage
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cargo llvm-cov --locked --all-features --lcov --output-path artifacts/lcov.info
          cargo llvm-cov report --summary-only --fail-under-lines 61 --fail-under-functions 65 | tee artifacts/coverage-summary.txt
          # Python operator tooling (scripts/) is release-chain code and is
          # covered by the operator regression tests; test code itself is
          # deliberately excluded from measurement.
          python3 -m pip install -q coverage
          python3 -m coverage run --source=scripts -m unittest discover -s tests/release
          python3 -m coverage xml -o artifacts/coverage.xml
          python3 -m coverage report | tee artifacts/coverage-python.txt
          test -s artifacts/lcov.info
          test -s artifacts/coverage-summary.txt
          test -s artifacts/coverage.xml
      - name: Upload coverage to Codecov
        if: always() && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./artifacts/lcov.info,./artifacts/coverage.xml
          use_oidc: true
          flags: rust
          name: rejection-rejector
          fail_ci_if_error: true
      - name: Upload coverage evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rejection-rejector-coverage-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
