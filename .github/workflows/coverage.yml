name: Rust coverage

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "fuzz/**"
      - "scripts/**"
      - "config/**"
      - ".cargo/**"
      - ".github/**"
      - "windows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".rustfmt.toml"
      - "deny.toml"
      - ".gitattributes"
      - ".gitignore"
      - ".editorconfig"
      - "docs/openapi-v1.json"
      - "docs/openapi-v1-baseline.json"
      - "docs/enterprise-policy.schema.json"
  schedule:
    - cron: "43 2 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per-SHA group: coverage evidence must never be superseded by later
  # pushes, or the release policy's latest-run evidence starves.
  group: rust-coverage-${{ github.sha }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Coverage evidence
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust 1.99.1 with llvm-tools
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.1
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov 0.9.1
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-llvm-cov@0.9.1
          checksum: true
          fallback: none
      - name: Generate coverage
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cargo llvm-cov --locked --all-features --lcov --output-path artifacts/lcov.info
          cargo llvm-cov report --summary-only --fail-under-lines 95 --fail-under-functions 90 | tee artifacts/coverage-summary.txt
          # Release-chain Python (scripts/, tools/, training/) is measured in
          # full scope; test code itself is deliberately excluded (D4). The
          # report below is the declared Python coverage artifact for the
          # receipt - it measures the whole operator surface, not only
          # scripts/.
          python3 -m pip install -q --require-hashes -r scripts/ci/requirements-coverage.txt
          python3 -m coverage run --source=scripts,tools,training --omit='*/tests/*' -m unittest discover -s tests/release
          python3 -m coverage xml -o artifacts/coverage.xml
          python3 -m coverage report | tee artifacts/coverage-python.txt
          test -s artifacts/lcov.info
          test -s artifacts/coverage-summary.txt
          test -s artifacts/coverage.xml
      - name: Upload coverage to Codecov
        if: always() && github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./artifacts/lcov.info,./artifacts/coverage.xml
          use_oidc: true
          flags: rust
          name: rejection-rejector
          fail_ci_if_error: true
      - name: Upload coverage evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rejection-rejector-coverage-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
