name: Rust fuzzing

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "fuzz/**"
      - "scripts/**"
      - "config/**"
      - ".cargo/**"
      - ".github/**"
      - "windows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".rustfmt.toml"
      - "deny.toml"
      - ".gitattributes"
      - ".gitignore"
      - ".editorconfig"
      - "docs/openapi-v1.json"
      - "docs/openapi-v1-baseline.json"
      - "docs/enterprise-policy.schema.json"
  schedule:
    - cron: "17 2 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-fuzz-main
  cancel-in-progress: true

jobs:
  fuzz:
    name: Bounded libFuzzer regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned nightly for libFuzzer
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: nightly-2026-09-26
      - name: Install latest verified cargo-fuzz release
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked cargo-fuzz --version 0.13.2
          cargo fuzz --version
      - name: Fuzz mailbox and quote boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/fuzz-logs
          cargo +nightly-2026-09-26 fuzz run mail_boundaries --fuzz-dir fuzz -- -max_total_time=90 -max_len=65536 -timeout=10 -rss_limit_mb=2048 2>&1 | tee artifacts/fuzz-logs/mail-boundaries.log
      - name: Fuzz MIME extraction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/fuzz-logs
          cargo +nightly-2026-09-26 fuzz run mime_parser --fuzz-dir fuzz -- -max_total_time=90 -max_len=262144 -timeout=10 -rss_limit_mb=2048 2>&1 | tee artifacts/fuzz-logs/mime-parser.log
      - name: Fuzz rejection policy language
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/fuzz-logs
          cargo +nightly-2026-09-26 fuzz run policy_language --fuzz-dir fuzz -- -max_total_time=90 -max_len=65536 -timeout=10 -rss_limit_mb=2048 2>&1 | tee artifacts/fuzz-logs/policy-language.log
      - name: Upload crash and corpus evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rejection-rejector-fuzz-${{ github.sha }}
          path: |
            artifacts/fuzz-logs/
            fuzz/artifacts/
            fuzz/corpus/
          if-no-files-found: ignore
          retention-days: 30
