name: Repository integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  committed-source:
    name: Committed text and history integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout complete audit history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test integrity checker without network access
        run: python3 -m unittest discover -s tests/release -p test_repository_integrity.py -v
      - name: Check committed bytes and retain reproducible audit evidence
        run: |
          python3 scripts/repository_integrity.py \
            --report artifacts/repository-audit.json \
            --history-count 100 \
            --patch-file artifacts/history-100.patch \
            --snapshot-file artifacts/source.zip \
            --bundle-file artifacts/repository-history.bundle
      - name: Upload source-integrity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repository-audit-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
