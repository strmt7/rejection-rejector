name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-ci-${{ github.ref }}
  # Main-only development uses each commit as an auditable evidence point.
  cancel-in-progress: false
jobs:
  test:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_WARNINGS: deny
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Prepare artifacts and assert exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f Cargo.lock
          test ! -f .github/finalize-source.py
      - name: Operator-tool regression tests on Windows and Linux
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -o pipefail
          python -m unittest discover -s tests/release -v 2>&1 | tee artifacts/operator-tools.log
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev xvfb openbox scrot dbus-x11
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Core tests
        shell: bash
        run: set -o pipefail; cargo test --locked --lib --no-default-features 2>&1 | tee artifacts/core-tests.log
      - name: Native GUI and CLI build
        run: cargo build --locked --bins
      - name: Verify embedded Windows application manifests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $kitRoot = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $mt = Get-ChildItem -LiteralPath $kitRoot -Filter mt.exe -Recurse -File |
            Where-Object { $_.FullName -match '\\x64\\mt\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $mt) { throw 'Windows SDK mt.exe was not found' }

          New-Item -ItemType Directory -Force artifacts/manifests | Out-Null
          foreach ($binary in @('target/debug/rejection-rejector.exe','target/debug/rr.exe')) {
            $name = [IO.Path]::GetFileNameWithoutExtension($binary)
            $out = "artifacts/manifests/$name.manifest.xml"
            & $mt.FullName -nologo "-inputresource:$binary;#1" "-out:$out"
            if ($LASTEXITCODE -ne 0) { throw "Could not extract manifest from $binary" }
            $xml = Get-Content -LiteralPath $out -Raw
            foreach ($required in @(
              'level="asInvoker"',
              'uiAccess="false"',
              'PerMonitorV2',
              '<longPathAware',
              '>true</',
              '<activeCodePage',
              '>UTF-8</',
              '{8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a}'
            )) {
              if (-not $xml.Contains($required)) {
                throw "Embedded manifest for $binary is missing required declaration: $required"
              }
            }
          }
      - name: All-feature and integration tests
        shell: bash
        run: set -o pipefail; cargo test --locked --all-features 2>&1 | tee artifacts/all-tests.log
      - name: Clippy without warnings
        shell: bash
        run: set -o pipefail; cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee artifacts/clippy.log
      - name: Headless offline smoke test
        shell: bash
        run: set -o pipefail; cargo run --locked --no-default-features --bin rr -- demo 2>&1 | tee artifacts/headless-demo.log
      - name: Readiness diagnostics smoke test
        if: runner.os == 'Linux'
        shell: bash
        env:
          RR_VAULT_PASSPHRASE: ci-only-local-vault-passphrase-2026
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/rejection-rejector-doctor"
          cargo run --locked --no-default-features --bin rr -- --data-dir "$RUNNER_TEMP/rejection-rejector-doctor" doctor 2>&1 | tee artifacts/doctor.log
      - name: Six native GUI captures and review geometry
        if: runner.os == 'Linux'
        run: timeout 120s dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1000x24' bash scripts/gui-smoke.sh
      - name: Verify tracked source was not modified
        run: git diff --exit-code HEAD
      - name: Source and toolchain evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          rustc --version > artifacts/toolchain.txt
          cargo --version >> artifacts/toolchain.txt
          git rev-parse HEAD > artifacts/COMMIT.txt
          cp Cargo.lock artifacts/
          git archive --format=zip HEAD -o artifacts/rejection-rejector-source.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: rejection-rejector-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: error
