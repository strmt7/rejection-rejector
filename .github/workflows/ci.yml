name: Rust CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Prepare artifacts and assert exact source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f Cargo.lock
          test ! -f .github/finalize-source.py
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev xvfb openbox scrot dbus-x11
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Core tests
        shell: bash
        run: set -o pipefail; cargo test --locked --lib --no-default-features 2>&1 | tee artifacts/core-tests.log
      - name: Native GUI and CLI build
        run: cargo build --locked --bins
      - name: All-feature and integration tests
        shell: bash
        run: set -o pipefail; cargo test --locked --all-features 2>&1 | tee artifacts/all-tests.log
      - name: Clippy without warnings
        shell: bash
        run: set -o pipefail; cargo clippy --locked --all-targets --all-features -- -D warnings 2>&1 | tee artifacts/clippy.log
      - name: Headless offline smoke test
        shell: bash
        run: set -o pipefail; cargo run --locked --no-default-features --bin rr -- demo 2>&1 | tee artifacts/headless-demo.log
      - name: Readiness diagnostics smoke test
        if: runner.os == 'Linux'
        shell: bash
        env:
          RR_VAULT_PASSPHRASE: ci-only-local-vault-passphrase-2026
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/rejection-rejector-doctor"
          cargo run --locked --no-default-features --bin rr -- --data-dir "$RUNNER_TEMP/rejection-rejector-doctor" doctor 2>&1 | tee artifacts/doctor.log
      - name: Six native GUI captures and review geometry
        if: runner.os == 'Linux'
        run: timeout 120s dbus-run-session -- xvfb-run -a -s '-screen 0 1600x1000x24' bash scripts/gui-smoke.sh
      - name: Build Windows release binaries
        if: runner.os == 'Windows'
        run: cargo build --locked --release --bins
      - name: Verify tracked source was not modified
        run: git diff --exit-code HEAD
      - name: Source and toolchain evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          rustc --version > artifacts/toolchain.txt
          cargo --version >> artifacts/toolchain.txt
          git rev-parse HEAD > artifacts/COMMIT.txt
          cp Cargo.lock artifacts/
          git archive --format=zip HEAD -o artifacts/rejection-rejector-source.zip
      - name: Collect Windows package
        if: runner.os == 'Windows' && success()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force artifacts/windows | Out-Null
          Copy-Item target/release/rejection-rejector.exe,target/release/rr.exe artifacts/windows/
          Copy-Item README.md,LICENSE,SECURITY.md,CHANGELOG.md artifacts/windows/
          Copy-Item -Recurse docs artifacts/windows/docs
          Copy-Item -Recurse scripts artifacts/windows/scripts
          Copy-Item Cargo.lock artifacts/windows/
          Copy-Item artifacts/COMMIT.txt artifacts/windows/
          Copy-Item artifacts/toolchain.txt artifacts/windows/
          $root = (Resolve-Path artifacts/windows).Path
          $sums = Get-ChildItem $root -Recurse -File | Sort-Object FullName | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath($root, $_.FullName).Replace('\','/')
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $relative"
          }
          $sums | Set-Content artifacts/windows/SHA256SUMS.txt -Encoding ascii
          Compress-Archive -Path artifacts/windows/* -DestinationPath artifacts/rejection-rejector-windows-x64.zip
          $packageHash = (Get-FileHash artifacts/rejection-rejector-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$packageHash  rejection-rejector-windows-x64.zip" | Set-Content artifacts/SHA256.txt -Encoding ascii
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: rejection-rejector-${{ matrix.os }}
          path: artifacts/
          if-no-files-found: error
