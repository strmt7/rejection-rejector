name: Release tooling tests

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "training/**"
      - "tests/release/**"
      - ".github/workflows/release-tooling.yml"
  schedule:
    - cron: "17 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tooling:
    name: Release tooling suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Syntax-check training and tooling scripts
        run: python -m py_compile tools/resource_guard.py training/train_lora.py
      - name: Run release-test suite
        run: python -m unittest discover -s tests/release -v
