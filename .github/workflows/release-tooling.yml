name: Release tooling tests

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "training/**"
      - "tests/release/**"
      - ".github/workflows/release-tooling.yml"
  schedule:
    - cron: "17 3 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tooling:
    name: Release tooling suite (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Syntax-check the full operator surface
        # D4: gate every operator/CI/training script, not two hardcoded files.
        # python -m compileall is the stdlib recursive form of py_compile; it
        # exits 1 on any syntax error. Scope: tools/, scripts/, training/ (all
        # release-chain Python). Exclusions: none — __pycache__ holds no .py.
        run: python -m compileall -q tools scripts training
      - name: Run release-test suite
        run: python -m unittest discover -s tests/release -v
      - name: Model-free calibration and data-contract tests
        run: python -m unittest discover -s training/tests -v
      - name: Frozen contract package suite
        # The validator's own tests live beside it in the frozen package;
        # read-only unittest discovery (record_checks.py writes receipts
        # and is deliberately not run here).
        run: python -m unittest discover -s tools/contract -p "test_*.py" -v
