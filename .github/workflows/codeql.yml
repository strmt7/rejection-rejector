name: CodeQL Rust security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Independent run identity per commit (S04/RR-06): CodeQL is exact-commit
  # release evidence, so push/schedule/dispatch runs group by SHA and can never
  # cancel each other; only superseded PR head runs share a group and cancel.
  group: codeql-rust-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL Rust security-extended
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # codeql-action init + analyze MUST move in lockstep: a version skew
      # between them fails the lane with "Loaded a configuration file for
      # version X, but running version Y" (verified on PR #12/#15).
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: rust
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:rust
