name: Supply-chain security

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-policy:
    name: Rust dependency, license and SBOM policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Cache Cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install pinned security tooling
        run: |
          cargo install --locked cargo-audit --version 0.22.2
          cargo install --locked cargo-deny --version 0.20.2
          cargo install --locked cargo-cyclonedx --version 0.5.9
      - name: RustSec audit
        run: cargo audit --deny warnings
      - name: License, source and dependency policy
        run: cargo deny check advisories licenses bans sources
      - name: Generate CycloneDX 1.5 SBOM
        env:
          SOURCE_DATE_EPOCH: ${{ github.event.repository.updated_at != '' && github.event.repository.updated_at || '0' }}
        run: |
          unset SOURCE_DATE_EPOCH
          cargo cyclonedx --format json --spec-version 1.5 --all-features --target all --override-filename rejection-rejector.cdx
          mkdir -p artifacts
          find . -maxdepth 2 -name 'rejection-rejector.cdx.json' -exec cp {} artifacts/rejection-rejector.cdx.json \;
          test -s artifacts/rejection-rejector.cdx.json
          sha256sum artifacts/rejection-rejector.cdx.json > artifacts/rejection-rejector.cdx.sha256
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rejection-rejector-sbom-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
