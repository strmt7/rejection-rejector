name: Supply-chain security

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Independent run identity per commit (S04): a ref-scoped group would let a
  # newer pending run replace an older pending run even with
  # cancel-in-progress: false, so dependency/SBOM evidence for earlier main
  # commits would be lost on a burst. Per-SHA groups give every pushed commit
  # its own run slot. Scheduled/dispatch runs group by their resolved SHA.
  group: supply-chain-${{ github.sha }}
  cancel-in-progress: false

jobs:
  advisories:
    name: Advisories (RUSTSEC/OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.1
      # Authoritative pinned RustSec audit (RR-04/D3c): this is the ONE
      # cargo-audit execution per tool/database; rust-policy keeps cargo-deny as
      # the second tool's policy check. Zero suppressions by standing policy
      # (docs/deepsource-dispositions.md): the former ignores (lexical-core
      # RUSTSEC-2023-0086 and the egui-winit a11y stack RUSTSEC-2026-0370/0371/
      # 0372) disappeared at the source when their dependency paths left the
      # graph. Any advisory must fail this job (--deny warnings).
      - name: Install pinned cargo-audit from verified releases
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          # 0.22.2 is the newest cargo-audit release present in the
          # installer's checksum-verified manifest (checked against upstream
          # manifests/cargo-audit.json at v2.88.0); later crate versions are
          # not yet adopted there and are never pinned speculatively.
          tool: cargo-audit@0.22.2
          checksum: true
          fallback: none
      - run: cargo audit --deny warnings
  rust-policy:
    name: Rust dependency, license and SBOM policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.1
      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install pinned security tooling from verified releases
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2,cargo-cyclonedx@0.5.9,cargo-machete@0.9.2
          checksum: true
          fallback: none
      # RR-04 consolidation: the authoritative pinned cargo-audit run lives in
      # the `advisories` job above (one audit per tool/database). This job is
      # the second tool's policy check: cargo-deny enforces the structured
      # deny.toml advisory/licence/ban/source records (owner + review date per
      # S07) and fails on any new unsuppressed advisory, yanked or banned crate.
      - name: License, source and dependency policy
        run: cargo deny check advisories licenses bans sources
      - name: Unused direct dependency check
        run: cargo machete --skip-target-dir
      - name: Generate CycloneDX 1.5 SBOM
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --all-features --target all --override-filename rejection-rejector.cdx
          mkdir -p artifacts
          find . -maxdepth 2 -name 'rejection-rejector.cdx.json' -exec cp {} artifacts/rejection-rejector.cdx.json \;
          test -s artifacts/rejection-rejector.cdx.json
          sha256sum artifacts/rejection-rejector.cdx.json > artifacts/rejection-rejector.cdx.sha256
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rejection-rejector-sbom-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
