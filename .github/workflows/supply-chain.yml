name: Supply-chain security

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  # Preserve dependency/SBOM evidence for every main commit.
  cancel-in-progress: false

jobs:
  advisories:
    name: Advisories (RUSTSEC/OSV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      # Same documented triage as tools/local_ci.py and osv-scanner.toml:
      # Linux-only a11y stack (accesskit_unix -> atspi -> zvariant 5), not
      # reachable in the shipped Windows binary, unmaintained notices with no
      # in-range patched version. Any new advisory must fail this job.
      - run: cargo install cargo-audit --locked
      - run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2026-0370
          --ignore RUSTSEC-2026-0371
          --ignore RUSTSEC-2026-0372
          --ignore RUSTSEC-2023-0086
  rust-policy:
    name: Rust dependency, license and SBOM policy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: never
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install pinned security tooling from verified releases
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-cyclonedx@0.5.9,cargo-machete@0.9.2
          checksum: true
          fallback: none
      - name: RustSec audit
        # Same documented triage as tools/local_ci.py and osv-scanner.toml:
        # Linux-only a11y stack (accesskit_unix -> atspi -> zvariant 5), not
        # reachable in the shipped Windows binary, unmaintained notices with
        # no in-range patched version (verified against crates.io 2026-10-19).
        run: >-
          cargo audit --deny warnings
          --ignore RUSTSEC-2026-0370
          --ignore RUSTSEC-2026-0371
          --ignore RUSTSEC-2026-0372
          --ignore RUSTSEC-2023-0086
      - name: License, source and dependency policy
        run: cargo deny check advisories licenses bans sources
      - name: Unused direct dependency check
        run: cargo machete --skip-target-dir
      - name: Generate CycloneDX 1.5 SBOM
        run: |
          cargo cyclonedx --format json --spec-version 1.5 --all-features --target all --override-filename rejection-rejector.cdx
          mkdir -p artifacts
          find . -maxdepth 2 -name 'rejection-rejector.cdx.json' -exec cp {} artifacts/rejection-rejector.cdx.json \;
          test -s artifacts/rejection-rejector.cdx.json
          sha256sum artifacts/rejection-rejector.cdx.json > artifacts/rejection-rejector.cdx.sha256
      - name: Upload SBOM evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rejection-rejector-sbom-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
