name: Rust public API compatibility

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-semver-${{ github.ref }}
  # Release packaging requires exact-commit SemVer evidence.
  cancel-in-progress: false

jobs:
  semver:
    name: Public Rust API SemVer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source and complete compatibility history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
      - name: Install cargo-semver-checks 0.50.0
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-semver-checks@0.50.0
          checksum: true
          fallback: none
      - name: Verify stable and previous-commit API baselines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          stable="$(cat .cargo/semver-baseline.txt)"
          [[ "$stable" =~ ^[0-9a-f]{40}$ ]]
          parent="$(git rev-parse HEAD^)"
          test "$stable" != "$GITHUB_SHA"
          git merge-base --is-ancestor "$stable" "$parent"
          printf '%s\n' "$GITHUB_SHA" > artifacts/COMMIT.txt
          printf 'stable %s\nparent %s\n' "$stable" "$parent" > artifacts/api-baselines.txt
          cargo semver-checks --version > artifacts/tool-version.txt
          for baseline in "$stable" "$parent"; do
            for feature_set in all-features only-explicit-features; do
              cargo semver-checks --package rejection-rejector --baseline-rev "$baseline" "--$feature_set" \
                2>&1 | tee "artifacts/semver-$baseline-$feature_set.log"
            done
          done
          git diff --exit-code HEAD
      - name: Retain exact compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rejection-rejector-semver-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
