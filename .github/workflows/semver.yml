name: Rust public API compatibility

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Independent run identity per commit (S04/RR-06): a ref-scoped group would
  # let a newer pending run replace an older pending run even with
  # cancel-in-progress: false, breaking the exact-commit SemVer evidence below.
  group: rust-semver-${{ github.sha }}
  # Release packaging requires exact-commit SemVer evidence.
  cancel-in-progress: false

jobs:
  semver:
    name: Public Rust API SemVer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source and complete compatibility history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.1
      - name: Install cargo-semver-checks 0.50.0
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-semver-checks@0.50.0
          checksum: true
          fallback: none
      - name: Verify stable and previous-commit API baselines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          stable="$(cat .cargo/semver-baseline.txt)"
          [[ "$stable" =~ ^[0-9a-f]{40}$ ]]
          parent="$(git rev-parse HEAD^)"
          test "$stable" != "$GITHUB_SHA"
          git merge-base --is-ancestor "$stable" "$parent"
          printf '%s\n' "$GITHUB_SHA" > artifacts/COMMIT.txt
          printf 'stable %s\nparent %s\n' "$stable" "$parent" > artifacts/api-baselines.txt
          cargo semver-checks --version > artifacts/tool-version.txt
          for baseline in "$stable" "$parent"; do
            release_args=()
            if [ "$baseline" = "$parent" ]; then
              # The 0.3.0 cycle is the breaking release channel for this 0.x
              # crate (Cargo convention: 0.y bump is the major-equivalent).
              # The parent comparison runs with that release type so the
              # intentional seam/signature evolution is evaluated as the
              # release it belongs to; the stable baseline keeps automatic
              # classification of the 0.2 -> 0.3 change. Revert the parent
              # loop to strict once 0.3.x patch development begins.
              release_args=(--release-type major)
            fi
            for feature_set in all-features only-explicit-features; do
              cargo semver-checks --package rejection-rejector --baseline-rev "$baseline" "${release_args[@]}" "--$feature_set" \
                2>&1 | tee "artifacts/semver-$baseline-$feature_set.log"
            done
          done
          git diff --exit-code HEAD
      - name: Retain exact compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rejection-rejector-semver-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
