name: Rust public API compatibility

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-semver-${{ github.ref }}
  # Release packaging requires exact-commit SemVer evidence.
  cancel-in-progress: false

jobs:
  semver:
    name: Public Rust API SemVer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main with parent history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
      - name: Install cargo-semver-checks 0.50.0
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-semver-checks@0.50.0
          checksum: true
          fallback: none
      - name: Verify public API compatibility with previous main commit
        shell: bash
        run: |
          set -euo pipefail
          parent="$(git rev-parse HEAD^)"
          cargo semver-checks --package rejection-rejector --baseline-rev "$parent"
