name: One-time Rust 2024 formatter

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: one-time-rust-2024-format
  cancel-in-progress: false

jobs:
  format:
    if: github.event.head_commit.message == 'ci: one-time Rust 2024 formatter'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          ref: main
      - name: Rust 1.98.1 rustfmt
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
          components: rustfmt
      - name: Format and commit only formatter output
        shell: bash
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          test "$before" = "$GITHUB_SHA"
          cargo fmt --all
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs' ':(glob)**/*.rs'
          git diff --cached --quiet && exit 0
          git commit -m "style: rustfmt Rust 2024 source"
          git push origin HEAD:main
