name: Mutation testing

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "fuzz/**"
      - "scripts/**"
      - "config/**"
      - ".cargo/**"
      - ".github/**"
      - "windows/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".rustfmt.toml"
      - "deny.toml"
      - ".gitattributes"
      - ".gitignore"
      - ".editorconfig"
      - "docs/openapi-v1.json"
      - "docs/openapi-v1-baseline.json"
      - "docs/enterprise-policy.schema.json"
  schedule:
    - cron: "11 2 * * 5"
  workflow_dispatch:
    inputs:
      scope:
        description: "Mutation scope"
        type: choice
        options:
          - safety-critical
          - full
        default: safety-critical

permissions:
  contents: read

concurrency:
  # Per-SHA group: evidence runs must never be superseded by later pushes,
  # otherwise the release policy's "latest main mutation evidence" starves.
  group: mutation-testing-${{ github.sha }}
  cancel-in-progress: false

jobs:
  safety-critical:
    name: Safety-critical mutation evidence
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_TERM_COLOR: never
      MUTATION_SINCE: ${{ github.event.before }}
      SCOPE_INPUT: ${{ inputs.scope }}
    steps:
      - name: Checkout exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
      - name: Install pinned cargo-mutants
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-mutants@27.1.0
          checksum: true
          fallback: none
      - name: Linux desktop dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev
      - name: Run safety-critical mutation suite
        id: mutants
        shell: bash
        run: |
          mkdir -p artifacts
          set +e
          set -o pipefail
          scope_args=()
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ]; then
            # Push runs mutate only the lines changed by the push: per-SHA
            # evidence in minutes instead of hours. The weekly schedule keeps
            # the full safety-critical core as the deep evidence pass.
            since="${MUTATION_SINCE:-}"
            if [ -z "$since" ] || [ "$since" = "0000000000000000000000000000000000000000" ]; then
              since="HEAD~1"
            fi
            scope_args+=(--since "$since")
          fi
          if [ "${GITHUB_EVENT_NAME}" != "schedule" ] && [ "${SCOPE_INPUT:-safety-critical}" = "safety-critical" ]; then
            scope_args+=(
              --file src/store.rs
              --file src/vault.rs
              --file src/emergency.rs
              --file src/decision.rs
              --file src/audit_anchor.rs
              --file src/policy.rs
              --file src/recovery.rs
              --file "src/recovery/*"
            )
          fi
          cargo mutants \
            --all-features \
            --timeout-multiplier 3 \
            --minimum-test-timeout 20 \
            --jobs 2 \
            --output artifacts/mutants \
            "${scope_args[@]}" \
            2>&1 | tee artifacts/mutation-run.log
          status=${PIPESTATUS[0]}
          set +o pipefail
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          case "$status" in
            0)
              echo "All viable tested mutants were caught."
              ;;
            2)
              echo "::error::Safety-critical mutation testing found surviving mutants. The release-quality gate requires all viable tested mutants to be caught."
              exit 2
              ;;
            3)
              echo "::error::Safety-critical mutation testing timed out. An inconclusive mutation result cannot satisfy the release-quality gate."
              exit 3
              ;;
            1|4|5|6|70)
              echo "::error::Mutation infrastructure/baseline failed with exit code $status"
              exit "$status"
              ;;
            *)
              echo "::error::Unexpected cargo-mutants exit code $status"
              exit "$status"
              ;;
          esac
      - name: Summarize mutation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f artifacts/mutants/outcomes.json ]; then
            python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/mutants/outcomes.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          summary = data.get("summary", data)
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
          fi
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rejection-rejector-mutants-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
