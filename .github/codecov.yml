coverage:
  status:
    project:
      default:
        # Hold the line at the measured floor; ratchet upward as coverage
        # grows. `threshold: 0%` means any regression below the target fails.
        target: 95%
        threshold: 0%
        if_ci_failed: error
    patch:
      default:
        # Every change must carry its own tests.
        target: 90%
        threshold: 0%
        if_ci_failed: error

# The review surface is the in-repo gate and the check runs; PR comment noise
# is deliberately off.
comment: false
