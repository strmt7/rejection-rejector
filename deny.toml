# Enterprise dependency policy for Rejection Rejector.
# Keep this aligned with the MIT application license and review any exception explicitly.

[graph]
all-features = true
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
# No advisory suppressions exist here by standing policy
# (docs/deepsource-dispositions.md): findings are fixed at source and any
# unfixable advisory stays visibly open in scanner output and the open-risk
# register. The former ignores (lexical-core RUSTSEC-2023-0086 and the
# egui-winit a11y stack RUSTSEC-2026-0370/0371/0372) disappeared at the
# source when the dependency paths left the graph.
[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  # webpki-roots distributes Mozilla CA trust-store data under this
  # permissive data license; this is not a blanket exception for unknown licenses.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OFL-1.1",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Ubuntu-font-1.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
  "sparse+https://index.crates.io/",
]
