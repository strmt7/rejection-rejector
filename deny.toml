# Enterprise dependency policy for Rejection Rejector.
# Keep this aligned with the MIT application license and review any exception explicitly.

[graph]
all-features = true
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
# Documented triage (mirrors osv-scanner.toml): Linux-only accessibility
# stack (accesskit_unix -> atspi -> zvariant 5 / zbus_names 4), unreachable
# in the shipped Windows binary; unmaintained notices with no in-range
# patched version (verified against crates.io 2026-10-19). Migration
# required upstream; re-check when atspi/accesskit publish zvariant 6.
# S07 suppression record: owner strmt7; review/removal date 2027-04-01
# (mirrors osv-scanner.toml ignoreUntil) for the a11y entries, 2027-04-28
# policy review for RUSTSEC-2023-0086 (see SECURITY.md). Every ignore carries
# its reason; a bare ignore without a current reason is itself a defect.
ignore = [
    { id = "RUSTSEC-2023-0086", reason = "lexical-core 0.7.6 Unsound, reached via nom 5 <- imap 2 (IMAP client); app talks only to a trusted provider/own host so practical exposure is low; remediation planned: io-imap migration (SECURITY.md). Reviewed 2026-10-28: the imap-2 path is already gone from Cargo.lock (cargo deny advisory-not-detected; cargo audit clean without this ignore) - SECURITY.md's removal criterion is met; drop at the 2027-04-28 policy review if still unmatched; owner strmt7" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant 5 unmaintained; Linux-only a11y stack, unreachable in the Windows binary; upstream migration required; owner strmt7; review 2027-04-01" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names 4 unmaintained; Linux-only a11y stack, unreachable in the Windows binary; upstream migration required; owner strmt7; review 2027-04-01" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive 5 unmaintained; Linux-only a11y stack, unreachable in the Windows binary; upstream migration required; owner strmt7; review 2027-04-01" },
]

[licenses]
version = 2
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  # webpki-roots distributes Mozilla CA trust-store data under this
  # permissive data license; this is not a blanket exception for unknown licenses.
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "OFL-1.1",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Ubuntu-font-1.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = [
  "https://github.com/rust-lang/crates.io-index",
  "sparse+https://index.crates.io/",
]
